
[platformio]
src_dir = main

[env:ql700]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200

; ESP32-S3FH4R2 Super Mini: 4 MB QIO flash + 2 MB QSPI PSRAM
board_upload.flash_size = 4MB
board_build.flash_mode = qio
board_build.psram_type = qio

; 4 MB layout with two OTA slots
board_build.partitions = boards/s3_supermini_fh4r2/partitions.csv


extra_scripts =
    post:scripts/platformio_prepare_assets.py

[platformio]
src_dir = main

[env:ql700]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf

monitor_speed = 115200

; ESP32-S3 N16R8
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.psram_type = opi

; Use original LabelSis partition layout
board_build.partitions = boards/devkitc_s3/partitions.csv

board_build.cmake_extra_args =
    -DBOARD=devkitc_s3

extra_scripts =
    post:scripts/platformio_prepare_assets.py